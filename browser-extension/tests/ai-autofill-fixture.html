<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>拾星 AI 智能填写测试</title>
    <style>
      body { font-family: sans-serif; padding: 24px; }
      label { display: block; margin: 12px 0; }
      input, select, textarea { min-height: 32px; width: 280px; }
      .ant-picker-dropdown { background: white; border: 1px solid #ccc; padding: 8px; width: 280px; }
      .ant-picker-cell { display: block; height: 32px; width: 120px; }
    </style>
  </head>
  <body>
    <form>
      <label>姓名拼音 <input id="name-pinyin" name="namePinyin" /></label>
      <label>最高学历
        <select id="degree" name="highestDegree">
          <option value="">请选择</option>
          <option value="本科">本科</option>
          <option value="硕士">硕士</option>
        </select>
      </label>
      <label>电子邮箱 <input id="email" type="email" value="user-kept@example.com" /></label>
      <label>自我描述 <textarea id="self-description"></textarea></label>
      <section>
        <h2>教育背景</h2>
        <label>经历描述 <textarea id="basicInfo_recruitEducationList_0_description" placeholder="请输入经历描述"></textarea></label>
      </section>
      <section>
        <h2>工作经历</h2>
        <div class="experience-record" data-section="work">
          <label>公司 <input id="basicInfo_recruitWorkingList_0_companyName" /></label>
          <label>职位 <input id="basicInfo_recruitWorkingList_0_jobTitle" /></label>
          <label>开始日期 <input id="basicInfo_recruitWorkingList_0_startDate" type="date" /></label>
          <label>结束日期 <input id="basicInfo_recruitWorkingList_0_endDate" type="date" /></label>
          <label>经历描述 <textarea id="basicInfo_recruitWorkingList_0_description"></textarea></label>
        </div>
        <div class="experience-record" data-section="work">
          <label>公司 <input id="basicInfo_recruitWorkingList_1_companyName" /></label>
          <label>职位 <input id="basicInfo_recruitWorkingList_1_jobTitle" /></label>
          <label>开始日期 <input id="basicInfo_recruitWorkingList_1_startDate" type="date" /></label>
          <label>结束日期 <input id="basicInfo_recruitWorkingList_1_endDate" type="date" /></label>
          <label>经历描述 <textarea id="basicInfo_recruitWorkingList_1_description"></textarea></label>
        </div>
      </section>
      <label>出生日期
        <span class="ant-picker"><input id="birth-date" name="birthDate" placeholder="请选择出生日期" readonly /></span>
      </label>
      <div id="birth-picker" class="ant-picker-dropdown ant-picker-dropdown-hidden" style="display: none">
        <button type="button" class="ant-picker-header-super-prev-btn" title="Previous year">上一年</button>
        <button type="button" class="ant-picker-year-btn">2026年</button>
        <button type="button" class="ant-picker-month-btn">2月</button>
        <button type="button" class="ant-picker-cell" data-date="2026-02-03">3日</button>
      </div>
      <fieldset>
        <legend>毕业状态</legend>
        <label><input id="student-status" type="radio" name="graduationStatus" value="在读" /> 在读</label>
        <label><input type="radio" name="graduationStatus" value="已毕业" /> 已毕业</label>
      </fieldset>
      <label>身份证号 <input id="national-id" /></label>
      <label>同意隐私协议 <input id="privacy-consent" type="checkbox" /></label>
    </form>
    <pre id="result">pending</pre>
    <script>
      const resume = {
        id: "resume-ai",
        title: "产品运营校招版",
        targetRole: "产品运营",
        content: {
          basics: { name: "王小星", englishName: "", birthDate: "2000-02-03", phone: "13800000000", email: "resume@example.com", city: "上海", linkedin: "", github: "", website: "", targetRole: "产品运营" },
          education: [{ school: "拾星大学", degree: "本科", major: "信息管理", startDate: "2023-09", endDate: "2027-06", gpa: "3.7", courses: "数据分析；数据库基础", honors: "校级奖学金" }],
          work: [
            { company: "拾星科技", title: "产品运营实习生", location: "上海", startDate: "2026-03", endDate: "2026-05", current: false, bullets: ["使用 SQL 分析用户转化"] },
            { company: "星河咨询", title: "商业分析实习生", location: "深圳", startDate: "2025-10", endDate: "2026-01", current: false, bullets: ["整理经营指标并支持复盘"] },
          ],
          projects: [], skills: [{ category: "数据分析", skills: ["SQL", "Excel"] }], campus: [], awards: [], certifications: [], languages: [], customSections: []
        }
      };
      const storage = {
        starjobResumes: [resume],
        activeResumeId: resume.id,
        fillMode: "ai",
        analysisOnly: true,
        aiOnly: false,
        aiFieldMappings: {},
        aiAutofillOnly: false,
        aiValueMappings: {},
      };
      window.chrome = {
        storage: {
          local: {
            get: async () => ({ ...storage }),
          },
        },
      };
      let pickerYear = 2026;
      const picker = document.querySelector("#birth-picker");
      const pickerCell = picker.querySelector(".ant-picker-cell");
      document.querySelector("#birth-date").addEventListener("click", () => {
        picker.style.display = "block";
        picker.classList.remove("ant-picker-dropdown-hidden");
      });
      picker.querySelector(".ant-picker-header-super-prev-btn").addEventListener("click", () => {
        pickerYear -= 1;
        picker.querySelector(".ant-picker-year-btn").textContent = `${pickerYear}年`;
        pickerCell.dataset.date = `${pickerYear}-02-03`;
      });
      pickerCell.addEventListener("click", () => {
        document.querySelector("#birth-date").value = pickerCell.dataset.date;
        picker.style.display = "none";
        picker.classList.add("ant-picker-dropdown-hidden");
      });

      async function runFixture() {
        const fillSource = await fetch("../starjob-resume-assistant/fill.js").then((response) => response.text());
        const analysis = await window.eval(fillSource);
        const findField = (needle) => analysis.fields.find((field) => field.label.includes(needle));
        const pinyinField = findField("姓名拼音");
        const degreeField = findField("最高学历");
        const emailField = findField("电子邮箱");
        const selfDescriptionField = findField("自我描述");
        const findByAttribute = (id) => analysis.fields.find((field) => field.attributes.includes(id));
        const educationDescriptionField = findByAttribute("basicInfo_recruitEducationList_0_description");
        const work1StartField = findByAttribute("basicInfo_recruitWorkingList_0_startDate");
        const work1EndField = findByAttribute("basicInfo_recruitWorkingList_0_endDate");
        const work1DescriptionField = findByAttribute("basicInfo_recruitWorkingList_0_description");
        const work2StartField = findByAttribute("basicInfo_recruitWorkingList_1_startDate");
        const work2EndField = findByAttribute("basicInfo_recruitWorkingList_1_endDate");
        const work2DescriptionField = findByAttribute("basicInfo_recruitWorkingList_1_description");
        const birthDateField = findField("出生日期");
        const graduationField = analysis.fields.find((field) => field.inputType === "radio" && field.context.includes("毕业状态"));
        storage.analysisOnly = false;
        storage.aiAutofillOnly = true;
        storage.aiValueMappings = {
          [pinyinField.fieldKey]: { value: "Wang Xiaoxing", confidence: 0.98, basis: "derived" },
          [degreeField.fieldKey]: { value: "本科", confidence: 0.99, basis: "resume" },
          [emailField.fieldKey]: { value: "resume@example.com", confidence: 0.99, basis: "resume" },
          [selfDescriptionField.fieldKey]: { value: "我擅长使用 SQL 和 Excel 从数据中提炼重点，做事注重结构与细节，并能够围绕产品运营目标持续学习和推进任务。", confidence: 0.96, basis: "derived" },
          // 故意交换模型返回日期，并完全省略经历描述；结构化字段必须由本地对应记录纠正和补齐。
          [work1StartField.fieldKey]: { value: "2026-05", confidence: 0.99, basis: "resume" },
          [work1EndField.fieldKey]: { value: "2026-03", confidence: 0.99, basis: "resume" },
          [work2StartField.fieldKey]: { value: "2026-01", confidence: 0.99, basis: "resume" },
          [work2EndField.fieldKey]: { value: "2025-10", confidence: 0.99, basis: "resume" },
          [birthDateField.fieldKey]: { value: "2000-02-03", confidence: 0.99, basis: "resume" },
          [graduationField.fieldKey]: { value: "在读", confidence: 0.97, basis: "derived" },
        };
        const summary = await window.eval(fillSource);
        const actual = {
          pinyin: document.querySelector("#name-pinyin").value,
          pinyinDerived: document.querySelector("#name-pinyin").dataset.starjobAiDerived,
          pinyinTitle: document.querySelector("#name-pinyin").title,
          degree: document.querySelector("#degree").value,
          email: document.querySelector("#email").value,
          selfDescription: document.querySelector("#self-description").value,
          structuredKeys: [educationDescriptionField.deterministicKey, work1StartField.deterministicKey, work1EndField.deterministicKey, work1DescriptionField.deterministicKey, work2StartField.deterministicKey, work2EndField.deterministicKey, work2DescriptionField.deterministicKey],
          structuredConfidences: [educationDescriptionField.deterministicConfidence, work1StartField.deterministicConfidence, work1EndField.deterministicConfidence, work1DescriptionField.deterministicConfidence, work2StartField.deterministicConfidence, work2EndField.deterministicConfidence, work2DescriptionField.deterministicConfidence],
          educationDescriptionRecordIndex: educationDescriptionField.recordIndex,
          educationDescription: document.querySelector("#basicInfo_recruitEducationList_0_description").value,
          workDateRecordIndices: [work1StartField.recordIndex, work1EndField.recordIndex, work2StartField.recordIndex, work2EndField.recordIndex],
          workDescriptionRecordIndices: [work1DescriptionField.recordIndex, work2DescriptionField.recordIndex],
          work1Start: document.querySelector("#basicInfo_recruitWorkingList_0_startDate").value,
          work1End: document.querySelector("#basicInfo_recruitWorkingList_0_endDate").value,
          work1Description: document.querySelector("#basicInfo_recruitWorkingList_0_description").value,
          work2Start: document.querySelector("#basicInfo_recruitWorkingList_1_startDate").value,
          work2End: document.querySelector("#basicInfo_recruitWorkingList_1_endDate").value,
          work2Description: document.querySelector("#basicInfo_recruitWorkingList_1_description").value,
          birthDate: document.querySelector("#birth-date").value,
          studentStatus: document.querySelector("#student-status").checked,
          nationalId: document.querySelector("#national-id").value,
          privacyConsent: document.querySelector("#privacy-consent").checked,
          summary,
        };
        const passed = actual.pinyin === "Wang Xiaoxing"
          && actual.pinyinDerived === "true"
          && actual.pinyinTitle.includes("AI 派生填写")
          && actual.degree === "本科"
          && actual.email === "user-kept@example.com"
          && actual.selfDescription.startsWith("我擅长")
          && actual.structuredKeys.join(",") === "education.description,work.startDate,work.endDate,work.description,work.startDate,work.endDate,work.description"
          && actual.structuredConfidences.every((confidence) => confidence === 1)
          && actual.educationDescriptionRecordIndex === 0
          && actual.educationDescription === "数据分析；数据库基础\n校级奖学金"
          && actual.workDateRecordIndices.join(",") === "0,0,1,1"
          && actual.workDescriptionRecordIndices.join(",") === "0,1"
          && actual.work1Start === "2026-03-01"
          && actual.work1End === "2026-05-01"
          && actual.work1Description === "使用 SQL 分析用户转化"
          && actual.work2Start === "2025-10-01"
          && actual.work2End === "2026-01-01"
          && actual.work2Description === "整理经营指标并支持复盘"
          && actual.birthDate === "2000-02-03"
          && actual.studentStatus === true
          && actual.nationalId === ""
          && actual.privacyConsent === false
          && actual.summary.filled === 12
          && actual.summary.preserved === 1
          && actual.summary.derived === 3
          && actual.summary.structured === 7
          && actual.summary.invalidDatesRepaired === 0
          && actual.summary.invalidDatesUnresolved === 0;
        document.querySelector("#result").textContent = JSON.stringify({ passed, actual });
        document.title = passed ? "STARJOB_AI_AUTOFILL_TEST_PASS" : "STARJOB_AI_AUTOFILL_TEST_FAIL";
      }

      runFixture().catch((error) => {
        document.querySelector("#result").textContent = JSON.stringify({ passed: false, error: String(error) });
        document.title = "STARJOB_AI_AUTOFILL_TEST_FAIL";
      });
    </script>
  </body>
</html>
