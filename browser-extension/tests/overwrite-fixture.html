<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>拾星网申助手覆盖模式测试</title>
    <style>
      body { font-family: sans-serif; padding: 24px; }
      label { display: block; margin: 12px 0; }
      input, select { width: 320px; min-height: 32px; }
    </style>
  </head>
  <body>
    <form>
      <label>姓名 <input id="name" autocomplete="name" value="旧姓名" /></label>
      <label>电子邮箱 <input id="email" type="email" value="old@example.com" /></label>
      <label>学历
        <select id="degree">
          <option value="旧学历">旧学历</option>
          <option value="本科">本科</option>
          <option value="硕士">硕士</option>
        </select>
      </label>
      <label>手机号 <input id="phone" type="tel" value="旧手机号" /></label>
    </form>
    <pre id="result">pending</pre>
    <script>
      window.chrome = {
        storage: {
          local: {
            get: async () => ({
              activeResumeId: "overwrite-resume",
              fillMode: "overwrite",
              starjobResumes: [{
                id: "overwrite-resume",
                title: "覆盖模式测试简历",
                content: {
                  basics: {
                    name: "王小星",
                    email: "stella@starjob.space",
                    phone: "13800000000",
                  },
                  education: [{ school: "拾星大学", degree: "本科" }],
                  work: [],
                },
              }],
            }),
          },
        },
      };
    </script>
    <script>
      async function runFixture() {
        const fillSource = await fetch("../starjob-resume-assistant/fill.js").then((response) => response.text());
        const summary = await window.eval(fillSource);
        const actual = {
          name: document.querySelector("#name").value,
          email: document.querySelector("#email").value,
          degree: document.querySelector("#degree").value,
          phone: document.querySelector("#phone").value,
          summary,
        };
        const passed = actual.name === "王小星"
          && actual.email === "stella@starjob.space"
          && actual.degree === "本科"
          && actual.phone === "13800000000"
          && actual.summary.filled >= 4
          && actual.summary.preserved === 0;
        document.querySelector("#result").textContent = JSON.stringify({ passed, actual });
        document.title = passed ? "STARJOB_OVERWRITE_TEST_PASS" : "STARJOB_OVERWRITE_TEST_FAIL";
      }

      runFixture().catch((error) => {
        document.querySelector("#result").textContent = JSON.stringify({ passed: false, error: String(error) });
        document.title = "STARJOB_OVERWRITE_TEST_FAIL";
      });
    </script>
  </body>
</html>
