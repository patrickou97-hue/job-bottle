<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>拾星 AI 750 字段硬上限测试</title>
  </head>
  <body>
    <main>
      <section id="emptyState" hidden></section>
      <section id="readyState" hidden>
        <select id="resumeSelect"></select>
        <label><input type="radio" name="fillMode" value="merge" />只填空白项</label>
        <label><input type="radio" name="fillMode" value="overwrite" />覆盖已有内容</label>
        <label><input type="radio" name="fillMode" value="ai" checked />AI 智能填写</label>
        <p id="modeHint"></p>
        <button id="fillButton" type="button">AI 智能填写当前页面</button>
        <p id="syncMeta"></p>
      </section>
      <section id="resultPanel" hidden>
        <strong id="resultTitle"></strong>
        <p id="resultText"></p>
        <details id="unmatchedDetails" hidden><ul id="unmatchedList"></ul></details>
      </section>
      <section id="progressPanel" hidden>
        <p id="progressAnnouncement"></p>
        <span id="progressElapsed"></span>
        <span id="progressLabel"></span>
        <strong id="progressValue"></strong>
        <div id="progressMeter"><span id="progressMeterFill"></span></div>
        <div data-step="extract"><p></p></div>
        <div data-step="match"><p></p></div>
        <div data-step="fill"><p></p></div>
        <div data-step="summary"><p></p></div>
      </section>
      <button id="openSync" type="button"></button>
      <button id="openSyncFromEmpty" type="button"></button>
      <button id="openGuide" type="button"></button>
      <button id="clearData" type="button"></button>
    </main>
    <pre id="result">pending</pre>
    <script>
      const resume = {
        id: "resume-limit",
        title: "字段上限测试简历",
        targetRole: "产品运营",
        content: { basics: { name: "王小星" }, education: [], work: [], projects: [], skills: [] },
      };
      const storage = {
        starjobResumes: [resume],
        activeResumeId: resume.id,
        fillMode: "ai",
        matchToken: "fixture-token",
        matchTokenExpiresAt: "2099-01-01T00:00:00.000Z",
        aiMatchingAvailable: true,
      };
      let modelCalls = 0;
      let pageWriteCalls = 0;

      function createFields(count, prefix) {
        return Array.from({ length: count }, (_, index) => ({
          fieldKey: `${prefix}-${index}`,
          label: `补充问题 ${index}`,
          attributes: `${prefix}-${index}`,
          context: "补充信息",
          inputType: "text",
          deterministicKey: null,
          deterministicConfidence: 0,
          recordIndex: null,
          options: [],
        }));
      }

      window.chrome = {
        storage: {
          local: {
            get: async () => ({ ...storage }),
            set: async (values) => Object.assign(storage, values),
            remove: async (keys) => {
              for (const key of Array.isArray(keys) ? keys : [keys]) delete storage[key];
            },
          },
        },
        tabs: {
          query: async () => [{ id: 8, url: "https://ats.example/apply" }],
          create: async () => ({}),
        },
        scripting: {
          executeScript: async ({ target }) => {
            if (!target.allFrames) {
              pageWriteCalls += 1;
              return [];
            }
            return [
              { frameId: 31, result: { scanned: 400, identified: 0, fields: createFields(400, "primary"), sensitive: 0 } },
              { frameId: 32, result: { scanned: 351, identified: 0, fields: createFields(351, "secondary"), sensitive: 0 } },
            ];
          },
        },
      };

      function waitFor(predicate, timeoutMs = 5000) {
        const startedAt = Date.now();
        return new Promise((resolve, reject) => {
          const check = () => {
            if (predicate()) {
              resolve();
              return;
            }
            if (Date.now() - startedAt >= timeoutMs) {
              reject(new Error("fixture wait timeout"));
              return;
            }
            setTimeout(check, 10);
          };
          check();
        });
      }

      async function runFixture() {
        const popupSource = await fetch("../starjob-resume-assistant/popup.js").then((response) => response.text());
        window.fetch = async () => {
          modelCalls += 1;
          throw new Error("model must not be called above the field limit");
        };
        window.eval(popupSource);
        await waitFor(() => document.querySelector("#resumeSelect").value === resume.id);
        document.querySelector('input[name="fillMode"][value="ai"]').click();
        document.querySelector("#fillButton").click();
        await waitFor(() => document.querySelector("#resultTitle").textContent === "表单字段过多，未开始填写");

        const actual = {
          modelCalls,
          pageWriteCalls,
          title: document.querySelector("#resultTitle").textContent,
          text: document.querySelector("#resultText").textContent,
          progressLabel: document.querySelector("#progressLabel").textContent,
          matchText: document.querySelector('[data-step="match"] p').textContent,
          fillText: document.querySelector('[data-step="fill"] p').textContent,
        };
        const passed = actual.modelCalls === 0
          && actual.pageWriteCalls === 0
          && actual.title === "表单字段过多，未开始填写"
          && actual.text.includes("检测到 751 个安全字段")
          && actual.text.includes("上限为 750 个")
          && actual.text.includes("未调用 AI")
          && actual.text.includes("没有改动页面")
          && actual.progressLabel.includes("751")
          && actual.progressLabel.includes("750")
          && actual.matchText.includes("未调用 AI")
          && actual.fillText.includes("没有写入页面");
        document.querySelector("#result").textContent = JSON.stringify({ passed, actual });
        document.title = passed
          ? "STARJOB_AI_AUTOFILL_LIMIT_TEST_PASS"
          : "STARJOB_AI_AUTOFILL_LIMIT_TEST_FAIL";
      }

      runFixture().catch((error) => {
        document.querySelector("#result").textContent = JSON.stringify({ passed: false, error: String(error), stack: error?.stack });
        document.title = "STARJOB_AI_AUTOFILL_LIMIT_TEST_FAIL";
      });
    </script>
  </body>
</html>
