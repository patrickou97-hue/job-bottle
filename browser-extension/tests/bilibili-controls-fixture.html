<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>pending</title>
    <style>
      body { font-family: sans-serif; padding: 24px; }
      label { display: block; margin: 10px 0; }
      input, textarea { min-height: 30px; width: 260px; }
      .ant-select { display: inline-block; padding: 4px; border: 1px solid #aaa; }
      .ant-select-dropdown { position: fixed; inset: 120px auto auto 360px; background: white; border: 1px solid #aaa; padding: 6px; }
      [role="option"] { display: block; padding: 6px; }
    </style>
  </head>
  <body>
    <form>
      <section><h2>基本信息</h2>
        <label>国家/地区 <select id="country"><option selected>中国大陆 +86</option></select></label>
        <label>手机号 <input id="phone" type="tel" autocomplete="tel-national" /></label>
      </section>
      <section><h2>教育经历</h2>
        <article>
          <label>学校名称 <input id="school" name="basicInfo_recruitEducationList_0_schoolName" /></label>
          <label>学历
            <span class="ant-select" id="degree-trigger">
              <input id="degree" role="combobox" aria-haspopup="listbox" aria-controls="degree-options" readonly />
            </span>
          </label>
          <label>入学时间 <input id="education-start" type="month" name="basicInfo_recruitEducationList_0_startDate" /></label>
          <label>毕业时间 <input id="education-end" type="month" name="basicInfo_recruitEducationList_0_endDate" /></label>
          <label>专业 <input id="major" name="basicInfo_recruitEducationList_0_majorName" /></label>
        </article>
      </section>
    </form>
    <pre id="result">pending</pre>
    <script>
      const resume = {
        id: "resume-bilibili",
        title: "校招简历",
        content: {
          basics: { name: "王小星", phone: "18523103352", email: "star@example.com" },
          education: [{ school: "西南财经大学", degree: "硕士", major: "金融学", startDate: "2025-09", endDate: "2027-08" }],
          work: [], projects: [], skills: [], campus: [], awards: [], certifications: [], languages: [],
        },
      };
      const storage = {
        starjobResumes: [resume], activeResumeId: resume.id, fillMode: "ai", analysisOnly: true,
        aiOnly: false, aiFieldMappings: {}, aiAutofillOnly: false, aiValueMappings: {},
      };
      window.chrome = { storage: { local: { get: async () => ({ ...storage }) } } };

      const trigger = document.querySelector("#degree-trigger");
      trigger.addEventListener("click", () => {
        if (document.querySelector("#degree-options")) return;
        window.setTimeout(() => {
          const popup = document.createElement("div");
          popup.id = "degree-options";
          popup.className = "ant-select-dropdown";
          popup.setAttribute("role", "listbox");
          for (const value of ["本科", "硕士", "博士"]) {
            const option = document.createElement("button");
            option.type = "button";
            option.setAttribute("role", "option");
            option.dataset.value = value;
            option.textContent = value;
            option.addEventListener("click", () => {
              document.querySelector("#degree").value = value;
              option.setAttribute("aria-selected", "true");
              popup.remove();
            });
            popup.append(option);
          }
          document.body.append(popup);
        }, 180);
      });

      (async () => {
        const fillSource = await fetch("../starjob-resume-assistant/fill.js").then((response) => response.text());
        const analysis = await window.eval(fillSource);
        const find = (id) => analysis.fields.find((field) => field.attributes.includes(id));
        const degreeField = analysis.fields.find((field) => field.label.includes("学历"));
        storage.analysisOnly = false;
        storage.aiAutofillOnly = true;
        storage.aiValueMappings = {
          [find("phone").fieldKey]: { value: "+86 18523103352", confidence: 0.92, basis: "normalized_fact" },
          [find("schoolName").fieldKey]: { value: "西南财经大学", confidence: 0.99, basis: "resume" },
          [degreeField.fieldKey]: { value: "硕士", confidence: 0.99, basis: "resume", optionMatch: { targetText: "硕士" } },
          [find("startDate").fieldKey]: { value: "2025-09", confidence: 0.99, basis: "resume" },
          [find("endDate").fieldKey]: { value: "2027-08", confidence: 0.99, basis: "resume" },
          [find("majorName").fieldKey]: { value: "金融学", confidence: 0.99, basis: "resume" },
        };
        const summary = await window.eval(fillSource);
        const actual = {
          phone: document.querySelector("#phone").value,
          school: document.querySelector("#school").value,
          degree: document.querySelector("#degree").value,
          educationStart: document.querySelector("#education-start").value,
          educationEnd: document.querySelector("#education-end").value,
          major: document.querySelector("#major").value,
          summary,
        };
        actual.passed = actual.phone === "18523103352"
          && actual.school === "西南财经大学"
          && actual.degree === "硕士"
          && actual.educationStart === "2025-09"
          && actual.educationEnd === "2027-08"
          && actual.major === "金融学"
          && summary.filled === 6
          && summary.failed === 0;
        document.querySelector("#result").textContent = JSON.stringify(actual);
        document.title = actual.passed ? "STARJOB_BILIBILI_CONTROLS_TEST_PASS" : "STARJOB_BILIBILI_CONTROLS_TEST_FAIL";
      })().catch((error) => {
        document.querySelector("#result").textContent = JSON.stringify({ passed: false, error: String(error), stack: error?.stack });
        document.title = "STARJOB_BILIBILI_CONTROLS_TEST_FAIL";
      });
    </script>
  </body>
</html>
