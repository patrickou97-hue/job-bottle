name: Review Referral Codes

on:
  schedule:
    # Immediate review happens in the upload route. This three-hour sweep only
    # claims rows whose first review never started because a request was cut off.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-referral-codes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review previously unclaimed referral codes once
        run: node scripts/review_referral_codes.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          MIMO_MODEL: ${{ secrets.MIMO_MODEL }}
